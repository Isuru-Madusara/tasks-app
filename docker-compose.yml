services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: tasks
    volumes:
      - dbdata:/var/lib/postgresql/data
  app:
    build: .
    environment:
      DATABASE_URL: postgres://app:app@db:5432/tasks
    ports:
      - '3000:3000'
    depends_on:
      - db
volumes:
  dbdata:
