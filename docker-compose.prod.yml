services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: tasks
    volumes:
      - dbdata:/var/lib/postgresql/data
  app:
    image: ${IMAGE}:${TAG}
    restart: always
    environment:
      DATABASE_URL: postgres://app:app@db:5432/tasks
    ports:
      - '80:3000'
    depends_on:
      - db
volumes:
  dbdata:
