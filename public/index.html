<!doctype html>
<html>
<head>
<meta charset='utf-8'>
<title>Tasks</title>
<style>
body{font-family:sans-serif;max-width:560px;margin:2rem auto;padding:0 1rem}
li{display:flex;gap:.5rem;margin:.4rem 0;align-items:center}
li span{flex:1}
.done{text-decoration:line-through;color:#888}
</style>
</head>
<body>
<h1>Tasks</h1>
<form id='f'><input id='t' placeholder='New task' required maxlength='200'> <button>Add</button></form>
<ul id='list'></ul>
<script>
const list = document.getElementById('list');
const H = { 'Content-Type': 'application/json' };

async function load() {
  const tasks = await (await fetch('/api/tasks')).json();
  list.innerHTML = '';
  tasks.forEach((t) => {
    const li = document.createElement('li');
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = t.done;
    cb.onchange = () => update(t.id, { done: cb.checked });
    const s = document.createElement('span');
    s.textContent = t.title;
    if (t.done) s.className = 'done';
    const ed = document.createElement('button');
    ed.textContent = 'Edit';
    ed.onclick = () => { const n = prompt('Edit task', t.title); if (n) update(t.id, { title: n }); };
    const del = document.createElement('button');
    del.textContent = 'Delete';
    del.onclick = async () => { await fetch('/api/tasks/' + t.id, { method: 'DELETE' }); load(); };
    li.append(cb, s, ed, del);
    list.append(li);
  });
}

async function update(id, data) {
  await fetch('/api/tasks/' + id, { method: 'PUT', headers: H, body: JSON.stringify(data) });
  load();
}

document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const i = document.getElementById('t');
  await fetch('/api/tasks', { method: 'POST', headers: H, body: JSON.stringify({ title: i.value }) });
  i.value = '';
  load();
};
load();
</script>
</body>
</html>
